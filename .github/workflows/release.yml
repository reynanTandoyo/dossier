name: Release

# Runs for a version tag such as v0.1.0. The tag must match the version in Cargo.toml.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Compare the tag with the version in Cargo.toml
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches Cargo.toml version $version"

  build:
    name: Build ${{ matrix.artifact }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: dossier
            asset: dossier-linux-x64
            artifact: dossier-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: dossier.exe
            asset: dossier-windows-x64.exe
            artifact: dossier-windows-x64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install stable Rust with the target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools for the static Linux build
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build the release program
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename the program and write its checksum file
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
          TARGET: ${{ matrix.target }}
        run: |
          mv "target/$TARGET/release/$BINARY" "$ASSET"
          hash=$(sha256sum "$ASSET" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$hash" "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - name: Upload the program and its checksum file
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  release:
    name: Publish the GitHub release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the programs and checksum files
        uses: actions/download-artifact@v8
        with:
          pattern: 'dossier-*'
          merge-multiple: true
          path: release

      - name: Create the GitHub release with the four files
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/dossier-linux-x64 \
            release/dossier-linux-x64.sha256 \
            release/dossier-windows-x64.exe \
            release/dossier-windows-x64.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
